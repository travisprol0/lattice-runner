x-runner-base: &runner-base
  # Default ubuntu-noble (24.04), NOT :latest (resolute). setup-python only ships
  # builds for GitHub-hosted Ubuntu images (22.04/24.04); resolute breaks pip SSL
  # ("ssl module in Python is not available"). myoung34: pin ubuntu-noble for 24.04.
  # Override with GITHUB_RUNNER_IMAGE_TAG (e.g. ubuntu-jammy, 2.338.2-ubuntu-noble).
  # pull_policy is NOT always: always-pull+recreate races GitHub sessions (see up.sh).
  image: "myoung34/github-runner:${GITHUB_RUNNER_IMAGE_TAG:-ubuntu-noble}"
  pull_policy: missing
  network_mode: host
  restart: unless-stopped
  # Give Runner.Listener time to drop its broker session on docker stop.
  stop_grace_period: 30s

x-runner-env: &runner-env
  # GitHub: --disableupdate for containers; refresh via `bash up.sh --upgrade` within ~30 days.
  # myoung34: any value is truthy. In-container auto-update does not persist (#251).
  DISABLE_AUTO_UPDATE: "true"
  # Required with CONFIGURED_ACTIONS_RUNNER_FILES_DIR (entrypoint exits otherwise).
  DISABLE_AUTOMATIC_DEREGISTRATION: "true"
  REPO_URL: "https://github.com/travisprol0/lattice-log"
  ACCESS_TOKEN: "${GITHUB_RUNNER_TOKEN:?set GITHUB_RUNNER_TOKEN}"
  # Per-service volumes isolate /tmp/runner; do not share one workdir across runners (README).
  RUNNER_WORKDIR: "/tmp/runner/work"
  # Persist registration only; binary comes from the image.
  CONFIGURED_ACTIONS_RUNNER_FILES_DIR: "/tmp/runner"

services:

  runner-1:
    <<: *runner-base
    environment:
      <<: *runner-env
      RUNNER_NAME: "talos-1"
      LABELS: "talos,talos-1"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "runner-1-data:/tmp/runner"
      - "runner-1-toolcache:/opt/hostedtoolcache"
      - "runner-1-pip-cache:/root/.cache/pip"
      - "runner-1-npm-cache:/root/.npm"
      - "runner-1-cypress-cache:/root/.cache/Cypress"

  runner-2:
